openapi: 3.1.1

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: Core Console API
  version: 0.1.0
  description: |
    Initial contract-first API definition for Core Console.
    The backend must implement this contract before the endpoint is used
    against a real environment.

servers:
  - url: /api
    description: Same-origin API gateway

tags:
  - name: Hello
    description: Initial API connectivity endpoints

paths:
  /helloWorld:
    get:
      operationId: getHelloWorld
      tags:
        - Hello
      summary: Get the hello world message
      description: Returns a minimal response used to verify API connectivity.
      security: []
      responses:
        "200":
          description: The hello world message was returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloWorldResponse"
              example:
                message: Hello, world!

        "500":
          description: An unexpected server error occurred.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error

components:
  schemas:
    HelloWorldResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          examples:
            - Hello, world!

    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable application error code.
