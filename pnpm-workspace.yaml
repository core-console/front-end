allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  # Issue #25 targets this reviewed release; keep the age exception version-specific.
  - lucide-react@1.49.0

overrides:
  # Orval's Scalar parser pins vulnerable undici 7.29.0; preserve the patched v7 API.
  # Remove when this parent accepts undici >=7.29.1 without the override.
  "@scalar/json-magic@0.15.3>undici": 7.29.1

patchedDependencies:
  # Orval 8.38.0 spreads case-sensitive header keys, duplicating Content-Type.
  # Retire after an upstream generator emits equivalent case-insensitive merging.
  "@orval/fetch@8.38.0": patches/@orval__fetch@8.38.0.patch
