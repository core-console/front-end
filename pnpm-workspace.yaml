allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  # Reviewed Node 24 typings; keep the fresh-release exception version-specific.
  - "@types/node@24.19.1"

overrides:
  # Orval's Scalar parser pins vulnerable undici 7.29.0; preserve the patched v7 API.
  # Remove when this parent accepts undici >=7.29.1 without the override.
  "@scalar/json-magic@0.15.3>undici": 7.29.1

patchedDependencies:
  # Orval 8.39.0 spreads case-sensitive header keys, duplicating Content-Type.
  # Retire after an upstream generator emits equivalent case-insensitive merging.
  "@orval/fetch@8.39.0": patches/@orval__fetch@8.39.0.patch
